name: TiendaDemo CI
on:
  push:
    branches:
      - main
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Limpiar y crear carpetas de reportes
        run: |
          rm -rf reports/unittest reports/behave
          mkdir -p reports/unittest
          mkdir -p reports/behave

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install unittest-xml-reporting behave

      - name: Ejecutar pruebas unitarias (Unit tests)
        run: python -m xmlrunner discover -s tests -o reports/unittest
        continue-on-error: true 

      - name: Ejecutar pruebas de aceptación (Acceptance tests)
        run: behave features --junit --junit-directory reports/behave
        continue-on-error: true

      - name: Archivar resultados (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: reports/**